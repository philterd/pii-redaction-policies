name: Validate policies

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install jsonschema

      - name: Run policy validation
        run: bash tests/validate.sh

  validate-phisql:
    runs-on: ubuntu-latest
    steps:
      - name: Check out policies
        uses: actions/checkout@v4

      - name: Check out PhiSQL reference compiler
        uses: actions/checkout@v4
        with:
          repository: philterd/phisql
          path: phisql

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build PhiSQL reference compiler
        run: mvn -B -q -DskipTests -f phisql/reference/pom.xml package

      - name: Validate .phisql policies
        run: |
          set -euo pipefail
          mvn -q -f phisql/reference/pom.xml dependency:build-classpath \
            -Dmdep.outputFile="$PWD/phisql-cp.txt"
          CP="phisql/reference/target/classes:$(cat phisql-cp.txt)"
          javac -cp "$CP" -d tests tests/PhisqlValidate.java
          phisql_files=$(find policies -name '*.phisql' | sort)
          if [ -z "$phisql_files" ]; then
            echo "No .phisql files found."
            exit 0
          fi
          java -cp "tests:$CP" PhisqlValidate $phisql_files
