name: Validate policies

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install jsonschema
        run: pip install jsonschema

      - name: Fetch schema
        run: |
          curl -fsSL -o /tmp/redaction-policy-schema.json \
            https://philterd.ai/schemas/redaction-policy/1.1.0/schema.json

      - name: Run policy validation
        run: bash tests/validate.sh

      - name: Validate policies against schema
        run: |
          python3 - <<'PY'
          import glob, json, sys
          from jsonschema import Draft202012Validator

          with open("/tmp/redaction-policy-schema.json") as f:
              validator = Draft202012Validator(json.load(f))

          failures = 0
          policies = sorted(glob.glob("policies/**/*.json", recursive=True))
          for path in policies:
              with open(path) as f:
                  policy = json.load(f)
              errors = sorted(validator.iter_errors(policy), key=str)
              if errors:
                  failures += 1
                  print(f"FAIL {path}")
                  for error in errors:
                      location = "/".join(str(p) for p in error.path) or "<root>"
                      print(f"  {location}: {error.message}")

          print(f"\nChecked {len(policies)} policy file(s).")
          if failures:
              print(f"Schema validation failed for {failures} file(s).")
              sys.exit(1)
          print("All policies conform to the schema.")
          PY

  philter:
    # Loads every policy into a published Philter image and redacts a sample with it. The image is
    # only pulled, never built or pushed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start Philter 4.0.0
        run: |
          key="sk_$(openssl rand -hex 16)"
          echo "::add-mask::$key"
          echo "PHILTER_API_KEY=$key" >> "$GITHUB_ENV"
          docker run -d --name philter -p 8080:8080 \
            -e PHILTER_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
            -e PHILTER_BOOTSTRAP_API_KEY="$key" \
            philterd/philter:4.0.0
          for i in $(seq 1 60); do
            curl -skf https://localhost:8080/api/health > /dev/null && exit 0
            sleep 2
          done
          docker logs philter
          exit 1

      - name: Load each policy into Philter
        run: bash tests/load-in-philter.sh
